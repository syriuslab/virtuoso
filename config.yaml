# VIRTUOSO Experiment Configuration
project: "VIRTUOSO Intrusion Detection"
datasets:
  - name: "UNSW-NB15"
    path_X: "data/UNSW_X.csv"
    path_y: "data/UNSW_y.csv"
    type: "real"
  - name: "CSE-CIC-IDS2018"
    path_X: "data/IDS_X_web.csv"
    path_y: "data/IDS_y_web.csv"
    type: "simulated"

models:
  - name: "RandomForest"
    enabled: true
  - name: "XGBoost"
    enabled: true
  - name: "LightGBM"
    enabled: true
  - name: "CatBoost"
    enabled: true
  - name: "DNN"
    enabled: true

preprocessing:
  label_encoding: true
  standard_scaler: true
  smote: true
  stratified_split: true

cross_validation:
  enabled: true
  folds: 5
  shuffle: true
  random_seed: 42

metrics:
  - Accuracy
  - Precision
  - Recall
  - F1-Score
  - AUC-ROC
  - AUC-PR
  - FPR
  - FNR
  - MCC

execution:
  environment: "Google Colab"
  time_limit: "30 minutes per model"
  hardware: "GPU (T4), 13 GB RAM"
  export_results: true
  save_plots: true

output:
  results_dir: "results/"
  plots_dir: "results/plots/"
  tables_dir: "results/tables/"
